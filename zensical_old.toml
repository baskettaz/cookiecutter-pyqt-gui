[project]
site_name = "Cookiecutter Qt6-Template"
site_url = "https://baskettaz.github.io/cookiecutter-qt6-template/"
site_description = "Cookiecutter template for a Python package"
repo_url = "https://github.com/baskettaz/cookiecutter-pyqt-gui"
repo_name = "baskettaz/cookiecutter-pyqt-gui"

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = "tutorial.md" },
  { "Project Structure" = "project_structure.md" },
  { "GitHub Actions" = "github_actions.md" },
  { "Prompts" = "prompts.md" },
  { "Design Decisions" = "design_decisions.md" },
  { "Troubleshooting" = "troubleshooting.md" },
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"
